apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: product-test
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/abrand55/k8s-learning.git
    targetRevision: main
    path: overlays/product-test
  destination:
    server: https://kubernetes.default.svc
    namespace: product-test
  syncPolicy:
    syncOptions:
      - CreateNamespace=true