apiVersion: apps/v1
kind: Deployment
metadata: 
  name: web
spec:
  replicas: 3
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels: 
        app: web
    spec:
      containers:
      - name: nginx
        image: nginx:1.27
        ports: 
        - containerPort: 80
        env:
          - name: GREETING
            valueFrom:
              configMapKeyRef:
                name: web-config
                key: GREETING
        volumeMounts:
          - name: html
            mountPath: /usr/share/nginx/html
      volumes:
        - name: html
          configMap:
            name: web-config


